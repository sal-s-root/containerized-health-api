name: Verify health API
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: docker build -t health-api:ci .
      - name: Verify container health
        shell: bash
        run: |
          docker run -d --name health-api -p 127.0.0.1:8080:8080 health-api:ci
          trap 'docker logs health-api; docker rm -f health-api' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
